# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-identify-dns"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-identify-dns"
description = "Identify by dns: the peer's reverse name from the resolver the node is given, forward-confirmed; a transport-layer claim, detected. A xmip-core-identify technology."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md): the identifier trait, the arrival and the claim live
# there. The mechanism it reads is declared once in xmip-core (ADR-0050).
identify = { package = "xmip-core-identify", git = "https://github.com/IlleNilsson/xmip-core-identify", branch = "main" }
# The names the transport writes on the arrival (context::property).
context = { package = "xmip-core-context", git = "https://github.com/IlleNilsson/xmip-core-context", branch = "main" }
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }
# The name the peer's address travels under, and its reader.
net = { package = "xmip-core-library-net", git = "https://github.com/IlleNilsson/xmip-core-library-net", branch = "main" }

[dev-dependencies]
# The Stream an arrival carries, for the tests that build one.
stream = { package = "xmip-core-stream", git = "https://github.com/IlleNilsson/xmip-core-stream", branch = "main" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
too_many_lines = "warn"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"
